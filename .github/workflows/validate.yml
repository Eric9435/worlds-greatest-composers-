name: Validate music history application
on:
  push:
    branches: [main, fix/history-production-release]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check chapters-eras.js
          node --check chapters-composers-1.js
          node --check chapters-composers-2.js
          node --check chapters-composers-3.js
          node --check chapters-composers-4.js
          node --check reader.js
          node --check app.js
          node --check history.js
          node --check sw.js
          node --check tests/history.test.cjs
          node --check tests/browser-smoke.cjs
      - name: Run music history regression tests
        run: node --test tests/history.test.cjs
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run real mobile-browser smoke test
        run: node tests/browser-smoke.cjs
