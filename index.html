function setLang(v){lang=v;localStorage.setItem("pfa-lang",v);render()}function setTab(v){tab=v;selected=null;query="";render()}function selectItem(id){selected=id;render();document.getElementById("detail")?.scrollIntoView({behavior:"smooth",block:"nearest"})}function mark(id){progress[id]=!progress[id];localStorage.setItem("pfa-progress",JSON.stringify(progress));render()}function setSearch(v){query=v;renderContent()}function setEra(v){eraFilter=v;renderContent()}function answer(i){if(feedback!==null)return;feedback=i;if(i===lessons[quizIndex].answer){progress[lessons[quizIndex].id]=true;localStorage.setItem("pfa-progress",JSON.stringify(progress))}renderContent()}function nextQuestion(){quizIndex=(quizIndex+1)%lessons.length;feedback=null;renderContent()}
function render(){document.documentElement.lang=lang==="my"?"my":"en";document.getElementById("en").classList.toggle("active",lang==="en");document.getElementById("my").classList.toggle("active",lang==="my");document.getElementById("subtitle").textContent=t("Music academy","ဂီတပညာရေး");document.getElementById("heroTitle").textContent=t("Explore music across the centuries.","ခေတ်အဆက်ဆက် ဂီတသမိုင်းကို လေ့လာပါ။");document.getElementById("heroText").textContent=t("Music theory, historical eras and the composers who shaped them.","ဂီတသီအိုရီ၊ သမိုင်းခေတ်များနှင့် ကမ္ဘာကျော်တေးရေးဆရာများကို လေ့လာပါ။");for(const [id,n] of [["eraCount",eras.length],["composerCount",composers.length],["lessonCount",lessons.length]])document.getElementById(id).textContent=n;document.getElementById("eraLabel").textContent=t("Eras","ခေတ်များ");document.getElementById("composerLabel").textContent=t("Composers","တေးရေးဆရာများ");document.getElementById("lessonLabel").textContent=t("Theory lessons","သီအိုရီသင်ခန်းစာ");document.getElementById("copyright").textContent=t("Separate academic references","ပညာရပ်ဆိုင်ရာ ကိုးကားချက်များ သီးခြားဖော်ပြထားသည်");document.getElementById("tabs").innerHTML=[["eras","Timeline","ခေတ်စဉ်"],["composers","Composers","တေးရေးဆရာ"],["theory","Theory","သီအိုရီ"],["quiz","Quiz","မေးခွန်း"],["references","References","ကိုးကားချက်"]].map(x=>'<button class="'+(tab===x[0]?"active":"")+'" onclick="setTab(\''+x[0]+'\')">'+t(x[1],x[2])+'</button>').join("");renderContent()}
function renderContent(){let out="";if(tab==="eras"){out='<h2>'+t("Music through history","ခေတ်အလိုက်ဂီတသမိုင်း")+'</h2><div class="grid">'+eras.map(e=>'<article class="card"><span class="pill">'+esc(e.dates)+'</span><h3>'+esc(t(e.en,e.my))+'</h3><p>'+esc(t(e.descEn,e.descMy))+'</p><button class="secondary" onclick="tab=\'composers\';eraFilter=\''+e.id+'\';render()">'+t("Explore composers","တေးရေးဆရာများကြည့်ရန်")+' →</button></article>').join("")+'</div>'}
if(tab==="composers"){let matches=composers.filter(c=>(eraFilter==="all"||c.era===eraFilter)&&(c.name+" "+c.my+" "+c.work).toLowerCase().includes(query.toLowerCase()));out='<h2>'+t("Composer library","တေးရေးဆရာစာကြည့်တိုက်")+'</h2><div class="toolbar"><input aria-label="Search composers" placeholder="'+t("Search name or work…","အမည် သို့မဟုတ် လက်ရာ ရှာရန်…")+'" value="'+esc(query)+'" oninput="setSearch(this.value)"><select onchange="setEra(this.value)" style="padding:12px;border-radius:12px;border:1px solid #d9deea"><option value="all">'+t("All eras","ခေတ်အားလုံး")+'</option>'+eras.map(e=>'<option value="'+e.id+'" '+(eraFilter===e.id?"selected":"")+'>'+esc(t(e.en,e.my))+'</option>').join("")+'</select></div><div class="grid">'+matches.map(c=>'<article class="card"><span class="pill">'+esc(c.years)+'</span><h3>'+esc(t(c.name,c.my))+'</h3><p>'+esc(c.work)+'</p><button class="secondary" onclick="selectItem('+c.id+')">'+t("Read profile","အကြောင်းဖတ်ရန်")+' →</button></article>').join("")+'</div>';let c=composers.find(c=>c.id===selected);if(c)out+='<article id="detail" class="card detail"><h2>'+esc(t(c.name,c.my))+'</h2><p>'+esc(c.years)+' · '+esc(t(eras.find(e=>e.id===c.era).en,eras.find(e=>e.id===c.era).my))+'</p><p>'+esc(t(c.en,c.descMy))+'</p><strong>'+t("Representative work","ထင်ရှားသောလက်ရာ")+':</strong> '+esc(c.work)+'</article>'}

if(tab==="quiz"){const l=lessons[quizIndex];out='<h2>'+t("Theory practice","သီအိုရီလေ့ကျင့်ခန်း")+'</h2><article class="card"><span class="pill">'+(quizIndex+1)+' / '+lessons.length+'</span><h3>'+esc(t(l.qEn,l.qMy))+'</h3><div class="options">'+l.choices.map((x,i)=>'<button class="'+(feedback!==null?(i===l.answer?"correct":i===feedback?"wrong":""):"")+'" onclick="answer('+i+')">'+esc(x)+'</button>').join("")+'</div>'+(feedback!==null?'<p><strong>'+t(feedback===l.answer?"Correct!":"Not quite.","ဖြေဆိုမှုရလဒ်")+ '</strong> '+t("Answer: ","အဖြေ: ")+esc(l.choices[l.answer])+'</p><button class="primary" onclick="nextQuestion()">'+t("Next question","နောက်မေးခွန်း")+' →</button>':"")+'</article>'}
